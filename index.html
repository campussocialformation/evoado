<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questions sur la Transition Enfance/Âge Adulte</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            perspective: 1000px;
        }

        .card-container {
            height: 350px;
            position: relative;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
        }

        .card-container.flipped .card {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            padding: 25px;
        }

        .card-front {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            border: 3px solid rgba(255,255,255,0.3);
            align-items: center;
            justify-content: center;
        }

        .card-back {
            background: white;
            transform: rotateY(180deg);
            overflow-y: auto;
            justify-content: space-between;
        }

        .card-back p {
            color: #333;
            line-height: 1.6;
            font-size: 0.95rem;
            text-align: left;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .card-number {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255,255,255,0.3);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .instructions {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
        }

        .reset-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }

        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }

        .response-link {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.3s;
            text-align: center;
            margin-top: auto;
        }

        .response-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        /* Modal pour afficher les réponses */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 20px;
        }

        .close:hover,
        .close:focus {
            color: #000;
        }

        .modal-content h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .modal-content ul {
            list-style-position: inside;
            padding-left: 0;
        }

        .modal-content li {
            margin-bottom: 12px;
            line-height: 1.6;
            color: #333;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.5rem;
            }

            .cards-grid {
                grid-template-columns: 1fr;
            }

            .card-container {
                height: 320px;
            }

            .card-back p {
                font-size: 0.85rem;
            }

            .modal-content {
                margin: 10% auto;
                padding: 20px;
                width: 95%;
            }
        }

        /* Animation d'apparition */
        .card-container {
            animation: fadeIn 0.5s ease-in;
            opacity: 0;
            animation-fill-mode: forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-container:nth-child(1) { animation-delay: 0.1s; }
        .card-container:nth-child(2) { animation-delay: 0.2s; }
        .card-container:nth-child(3) { animation-delay: 0.3s; }
        .card-container:nth-child(4) { animation-delay: 0.4s; }
        .card-container:nth-child(5) { animation-delay: 0.5s; }
        .card-container:nth-child(6) { animation-delay: 0.6s; }
        .card-container:nth-child(7) { animation-delay: 0.7s; }
        .card-container:nth-child(8) { animation-delay: 0.8s; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Questions sur la Transition Enfance/Âge Adulte</h1>
        
        <div class="instructions">
            <p>Cliquez sur une carte pour découvrir la question. Cliquez sur "Voir les éléments de réponse" pour plus de détails.</p>
        </div>

        <div class="cards-grid" id="cardsGrid"></div>

        <div style="text-align: center;">
            <button class="reset-btn" onclick="resetCards()">Retourner toutes les cartes</button>
        </div>
    </div>

    <!-- Modal pour les réponses -->
    <div id="responseModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle"></h2>
            <ul id="modalContent"></ul>
        </div>
    </div>

    <script>
        const questionsData = [
            {
                question: "Quels sont la manière et le moment opportuns pour préparer de manière anticipée les adolescents et les familles à avoir un nouveau statut et de nouvelles responsabilités ?",
                responses: [
                    "Débuter la préparation dès 14-15 ans (3-4 ans avant la majorité)",
                    "Organiser des réunions de projet personnalisé incluant la thématique de la transition",
                    "Mettre en place des ateliers sur les droits et devoirs à l'âge adulte",
                    "Prévoir des visites de structures adultes (ESAT, FAM, SAVS, etc.)",
                    "Travailler progressivement l'autodétermination et la prise de décision",
                    "Associer la famille via des temps d'information dédiés"
                ]
            },
            {
                question: "Quels intervenants spécialisés peuvent organiser avec les personnes et les familles qui le souhaitent des réunions thématiques ?",
                responses: [
                    "Psychologue ou neuropsychologue",
                    "Équipe de la MDPH (pour les droits et démarches)",
                    "Référent parcours handicap",
                    "Conseiller en insertion professionnelle (Cap Emploi)",
                    "Assistant social",
                    "Mandataire judiciaire (pour parler protection juridique)",
                    "Pairs-aidants ou anciens usagers",
                    "Représentants d'associations de familles"
                ]
            },
            {
                question: "Comment développer les compétences des adolescents en situation de handicap afin de mieux les préparer au passage à l'âge adulte ?",
                responses: [
                    "Renforcer les compétences psychosociales (autonomie, communication, gestion émotionnelle)",
                    "Travailler les actes de la vie quotidienne (AVQ)",
                    "Travailler le rythme de la journée et la succession des temps formels et informels",
                    "Développer les habiletés professionnelles via stages ou ateliers",
                    "Former à l'utilisation des transports en commun",
                    "Enseigner la gestion budgétaire de base",
                    "Favoriser l'expression des choix et l'autodétermination",
                    "Utiliser des outils adaptés (FALC, supports visuels)"
                ]
            },
            {
                question: "Comment intensifier l'accompagnement de la personne et de ses aidants à cette période ?",
                responses: [
                    "Augmenter la fréquence des entretiens individuels",
                    "Mettre en place un référent unique de transition",
                    "Créer des groupes de parole pour adolescents et familles séparément",
                    "Organiser des réunions de coordination pluridisciplinaire",
                    "Proposer un soutien psychologique renforcé",
                    "Prévoir des temps de répit pour les aidants",
                    "Établir un calendrier de suivi rapproché (mensuel)"
                ]
            },
            {
                question: "Quel accompagnement proposer aux personnes et aux familles le cas échéant concernant le suivi de la transition biologique et ses conséquences sur l'identité ? Quels supports proposer pour améliorer la compréhension ? Comment adapter le discours en fonction de la personne ?",
                responses: [
                    "Proposer des séances d'éducation à la vie affective et sexuelle adaptées",
                    "Utiliser des supports FALC sur la puberté et les changements corporels",
                    "Faire intervenir une infirmière ou sage-femme spécialisée",
                    "Orienter vers des dispositifs handigynéco",
                    "Adapter le discours au niveau de compréhension (pictogrammes, vidéos, etc.)",
                    "Travailler l'image de soi et l'estime de soi",
                    "Proposer des entretiens individuels sur l'intimité et le consentement",
                    "Orienter vers des ressources spécialisées si nécessaire"
                ]
            },
            {
                question: "Quel lien établir avec les professionnels et les nouveaux interlocuteurs assurant le suivi pour l'âge adulte ?",
                responses: [
                    "Organiser des réunions de transition tripartites (IME/structure adulte/famille)",
                    "Transmettre un dossier de liaison complet",
                    "Prévoir des périodes de chevauchement et de co-accompagnement",
                    "Identifier un référent de parcours dans la structure d'accueil",
                    "Mettre en place des conventions de partenariat entre structures",
                    "Prévoir des visites croisées entre professionnels",
                    "Assurer un suivi post-transition (bilan à 3-6 mois)"
                ]
            },
            {
                question: "À quels intervenants spécialisés faites-vous appel pour organiser la transition enfance/âge adulte avec les personnes et les familles ?",
                responses: [
                    "Coordonnateur de parcours complexe",
                    "Référent MDPH",
                    "Équipe mobile d'appui à la scolarisation (EMAS) si besoin",
                    "Services de la protection de l'enfance (si ASE)",
                    "Dispositif d'Appui à la Coordination (DAC)",
                    "Réseau de santé ou dispositif territorial (PTSM)",
                    "Équipe relais handicaps rares si pertinent",
                    "Service d'accompagnement (SAVS/SAMSAH) en anticipation"
                ]
            },
            {
                question: "Quel lien s'établit entre les professionnels du soin assurant le suivi et les nouveaux interlocuteurs du soin pour la prise en charge adulte (pédopsychiatre à psychiatre, pédiatre à généraliste) ?",
                responses: [
                    "Organiser une consultation de transition avec les deux médecins",
                    "Prévoir une période de suivi conjoint (quelques mois)",
                    "Organiser une réunion de synthèse médicale",
                    "Assurer la continuité des traitements et protocoles",
                    "Utiliser des outils de liaison type \"formulaire de transition\"",
                    "Respecter le secret médical et recueillir les consentements"
                ]
            }
        ];

        const cardsGrid = document.getElementById('cardsGrid');
        const modal = document.getElementById('responseModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalContent = document.getElementById('modalContent');

        // Créer les cartes
        questionsData.forEach((data, index) => {
            const cardContainer = document.createElement('div');
            cardContainer.className = 'card-container';
            cardContainer.innerHTML = `
                <div class="card">
                    <div class="card-face card-front">
                        <div class="card-number">${index + 1}</div>
                        <div>Question ${index + 1}</div>
                    </div>
                    <div class="card-face card-back">
                        <p>${data.question}</p>
                        <a href="#" class="response-link" onclick="showResponse(${index}); return false;">📋 Voir les éléments de réponse</a>
                    </div>
                </div>
            `;
            
            // Gérer le clic sur la carte (mais pas sur le lien)
            const card = cardContainer.querySelector('.card');
            cardContainer.addEventListener('click', function(e) {
                // Ne retourne pas la carte si on clique sur le lien
                if (!e.target.classList.contains('response-link')) {
                    this.classList.toggle('flipped');
                }
            });
            
            cardsGrid.appendChild(cardContainer);
        });

        // Afficher la modal avec les réponses
        function showResponse(index) {
            const data = questionsData[index];
            modalTitle.textContent = `Question ${index + 1} : Éléments de réponse`;
            modalContent.innerHTML = '';
            
            data.responses.forEach(response => {
                const li = document.createElement('li');
                li.textContent = response;
                modalContent.appendChild(li);
            });
            
            modal.style.display = 'block';
            // Empêcher la propagation pour ne pas fermer la modal immédiatement
            event.stopPropagation();
        }

        // Fermer la modal
        function closeModal() {
            modal.style.display = 'none';
        }

        // Fermer la modal si on clique en dehors
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }

        // Fonction pour retourner toutes les cartes
        function resetCards() {
            const allCards = document.querySelectorAll('.card-container');
            allCards.forEach(card => {
                card.classList.remove('flipped');
            });
        }

        // Empêcher la sélection de texte lors du double-clic
        document.addEventListener('selectstart', function(e) {
            if (e.target.closest('.card-front')) {
                e.preventDefault();
            }
        });

        // Fermer la modal avec la touche Échap
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
