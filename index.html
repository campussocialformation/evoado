<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Famille en Or - Transition Enfance/Âge Adulte</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .game-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header avec logo */
        .game-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .game-title {
            font-family: 'Bebas Neue', cursive;
            font-size: 3.5rem;
            color: #ffd700;
            text-shadow:
                3px 3px 0 #ff6b00,
                6px 6px 0 rgba(0,0,0,0.3);
            letter-spacing: 3px;
            animation: titleGlow 2s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            from { text-shadow: 3px 3px 0 #ff6b00, 6px 6px 0 rgba(0,0,0,0.3), 0 0 20px rgba(255,215,0,0.3); }
            to { text-shadow: 3px 3px 0 #ff6b00, 6px 6px 0 rgba(0,0,0,0.3), 0 0 40px rgba(255,215,0,0.6); }
        }

        .game-subtitle {
            color: #87ceeb;
            font-size: 1.1rem;
            margin-top: 10px;
        }

        /* Score Board */
        .score-board {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-bottom: 25px;
        }

        .score-display {
            background: linear-gradient(180deg, #2d2d44 0%, #1a1a2e 100%);
            border: 4px solid #ffd700;
            border-radius: 15px;
            padding: 15px 40px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255,215,0,0.3);
        }

        .score-label {
            color: #ffd700;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .score-value {
            font-family: 'Bebas Neue', cursive;
            font-size: 3rem;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        /* Question Display */
        .question-panel {
            background: linear-gradient(180deg, #1e3a5f 0%, #0d2137 100%);
            border: 5px solid #ffd700;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow:
                0 0 30px rgba(255,215,0,0.4),
                inset 0 0 50px rgba(0,0,0,0.3);
        }

        .question-number {
            background: #ffd700;
            color: #1a1a2e;
            padding: 5px 20px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
        }

        .question-text {
            color: #fff;
            font-size: 1.3rem;
            line-height: 1.6;
            text-align: center;
        }

        /* Answer Board */
        .answer-board {
            background: linear-gradient(180deg, #0a1628 0%, #162447 100%);
            border: 6px solid #ffd700;
            border-radius: 20px;
            padding: 20px;
            box-shadow:
                0 0 40px rgba(255,215,0,0.3),
                inset 0 0 60px rgba(0,0,0,0.5);
        }

        .answers-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .answer-row {
            display: flex;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .answer-row:hover:not(.revealed) {
            transform: scale(1.02);
        }

        .answer-number {
            background: linear-gradient(180deg, #ffd700 0%, #ff8c00 100%);
            color: #1a1a2e;
            width: 50px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Bebas Neue', cursive;
            font-size: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 0 #b8860b;
        }

        .answer-box {
            flex: 1;
            background: linear-gradient(180deg, #1e3a5f 0%, #0d2137 100%);
            border: 3px solid #4a6fa5;
            border-radius: 8px;
            height: 55px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: relative;
            overflow: hidden;
        }

        .answer-hidden {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .answer-hidden::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                90deg,
                #2d4a6f 0px,
                #2d4a6f 20px,
                #1e3a5f 20px,
                #1e3a5f 40px
            );
        }

        .answer-text {
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            opacity: 0;
            transform: rotateX(90deg);
            transition: all 0.5s;
            z-index: 1;
        }

        .answer-row.revealed .answer-box {
            background: linear-gradient(180deg, #2563eb 0%, #1e40af 100%);
            border-color: #60a5fa;
            animation: revealFlash 0.5s;
        }

        .answer-row.revealed .answer-text {
            opacity: 1;
            transform: rotateX(0deg);
        }

        .answer-row.revealed .answer-hidden::before {
            display: none;
        }

        @keyframes revealFlash {
            0%, 50% { background: linear-gradient(180deg, #ffd700 0%, #ff8c00 100%); }
            100% { background: linear-gradient(180deg, #2563eb 0%, #1e40af 100%); }
        }

        .answer-points {
            background: linear-gradient(180deg, #ffd700 0%, #ff8c00 100%);
            color: #1a1a2e;
            width: 70px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Bebas Neue', cursive;
            font-size: 1.8rem;
            border-radius: 8px;
            box-shadow: 0 4px 0 #b8860b;
            position: relative;
        }

        .points-hidden {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, #1e3a5f 0%, #0d2137 100%);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .points-hidden::after {
            content: '?';
            color: #4a6fa5;
            font-size: 1.5rem;
        }

        .answer-row.revealed .points-hidden {
            display: none;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .btn {
            font-family: 'Bebas Neue', cursive;
            font-size: 1.3rem;
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-reveal {
            background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%);
            color: white;
            box-shadow: 0 4px 0 #15803d;
        }

        .btn-reveal:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #15803d;
        }

        .btn-reveal:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #15803d;
        }

        .btn-next {
            background: linear-gradient(180deg, #ffd700 0%, #ff8c00 100%);
            color: #1a1a2e;
            box-shadow: 0 4px 0 #b8860b;
        }

        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #b8860b;
        }

        .btn-reset {
            background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%);
            color: white;
            box-shadow: 0 4px 0 #b91c1c;
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #b91c1c;
        }

        /* Question Navigation */
        .question-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .nav-dot {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #2d4a6f;
            border: 3px solid #4a6fa5;
            color: #87ceeb;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-dot:hover {
            background: #3d5a7f;
            transform: scale(1.1);
        }

        .nav-dot.active {
            background: linear-gradient(180deg, #ffd700 0%, #ff8c00 100%);
            border-color: #ffd700;
            color: #1a1a2e;
            box-shadow: 0 0 15px rgba(255,215,0,0.5);
        }

        .nav-dot.completed {
            background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%);
            border-color: #22c55e;
            color: white;
        }

        /* Sound effect visual */
        .ding-effect {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255,215,0,0.8);
            opacity: 0;
            pointer-events: none;
            z-index: 1000;
        }

        .ding-effect.show {
            animation: dingPop 0.6s ease-out;
        }

        @keyframes dingPop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
        }

        /* Wrong answer X */
        .wrong-mark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 15rem;
            color: #ef4444;
            text-shadow: 0 0 50px rgba(239,68,68,0.8);
            opacity: 0;
            pointer-events: none;
            z-index: 1000;
            font-family: 'Bebas Neue', cursive;
        }

        .wrong-mark.show {
            animation: wrongPop 0.8s ease-out;
        }

        @keyframes wrongPop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3) rotate(-10deg); }
            30% { opacity: 1; transform: translate(-50%, -50%) scale(1.1) rotate(5deg); }
            50% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.2) rotate(0deg); }
        }

        /* Instructions */
        .instructions {
            background: rgba(255,215,0,0.1);
            border: 2px solid rgba(255,215,0,0.3);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            text-align: center;
        }

        .instructions p {
            color: #87ceeb;
            font-size: 0.95rem;
        }

        .instructions strong {
            color: #ffd700;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .game-title {
                font-size: 2.5rem;
            }

            .question-text {
                font-size: 1.1rem;
            }

            .answer-number {
                width: 35px;
                font-size: 1.5rem;
            }

            .answer-points {
                width: 50px;
                font-size: 1.3rem;
            }

            .answer-text {
                font-size: 0.8rem;
            }

            .score-board {
                gap: 20px;
            }

            .score-display {
                padding: 10px 25px;
            }

            .score-value {
                font-size: 2rem;
            }
        }

        @media (max-width: 480px) {
            .answer-box {
                padding: 0 10px;
            }

            .answer-text {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1 class="game-title">🌟 L'équipe en Or 🌟</h1>
            <p class="game-subtitle">Édition Transition Enfance / Âge Adulte</p>
        </header>

        <div class="score-board">
            <div class="score-display">
                <div class="score-label">Score Total</div>
                <div class="score-value" id="totalScore">0</div>
            </div>
            <div class="score-display">
                <div class="score-label">Cette Manche</div>
                <div class="score-value" id="roundScore">0</div>
            </div>
        </div>

        <div class="question-panel">
            <div class="question-number" id="questionNumber">Question 1/8</div>
            <p class="question-text" id="questionText"></p>
        </div>

        <div class="answer-board">
            <div class="answers-grid" id="answersGrid"></div>
        </div>

        <div class="controls">
            <button class="btn btn-reveal" onclick="revealAll()">Tout Révéler</button>
            <button class="btn btn-next" onclick="nextQuestion()">Question Suivante →</button>
            <button class="btn btn-reset" onclick="resetGame()">Recommencer</button>
        </div>

        <div class="question-nav" id="questionNav"></div>

           </div>

    <div class="ding-effect" id="dingEffect">✓</div>
    <div class="wrong-mark" id="wrongMark">✗</div>

    <script>
        const questionsData = [
            {
                question: "Quels sont la manière et le moment opportuns pour préparer les adolescents et les familles à un nouveau statut ?",
                answers: [
                    { text: "Débuter la préparation dès 14-15 ans", points: 25 },
                    { text: "Organiser des réunions de projet personnalisé", points: 20 },
                    { text: "Mettre en place des ateliers droits/devoirs", points: 18 },
                    { text: "Prévoir des visites de structures adultes", points: 15 },
                    { text: "Travailler l'autodétermination", points: 12 },
                    { text: "Associer la famille via des temps dédiés", points: 10 }
                ]
            },
            {
                question: "Quels intervenants spécialisés peuvent organiser des réunions thématiques avec les personnes et familles ?",
                answers: [
                    { text: "Psychologue ou neuropsychologue", points: 22 },
                    { text: "Équipe de la MDPH", points: 20 },
                    { text: "Référent parcours handicap", points: 18 },
                    { text: "Assistant social", points: 15 },
                    { text: "Mandataire judiciaire", points: 13 },
                    { text: "Pairs-aidants ou anciens de l ime", points: 12 }
                ]
            },
            {
                question: "Comment développer les compétences des adolescents en situation de handicap pour le passage à l'âge adulte ?",
                answers: [
                    { text: "Renforcer les compétences psychosociales", points: 24 },
                    { text: "Travailler les actes de la vie quotidienne", points: 20 },
                    { text: "Développer les habiletés professionnelles", points: 18 },
                    { text: "Former à l'utilisation des transports", points: 15 },
                    { text: "Enseigner la gestion budgétaire", points: 13 },
                    { text: "Utiliser des outils adaptés (FALC)", points: 10 }
                ]
            },
            {
                question: "Comment intensifier l'accompagnement de la personne et de ses aidants à cette période ?",
                answers: [
                    { text: "Augmenter la fréquence des entretiens", points: 23 },
                    { text: "Mettre en place un référent unique", points: 20 },
                    { text: "Créer des groupes de parole", points: 17 },
                    { text: "Organiser des réunions pluridisciplinaires", points: 15 },
                    { text: "Proposer un soutien psychologique renforcé", points: 13 },
                    { text: "Prévoir des temps de répit pour aidants", points: 12 }
                ]
            },
            {
                question: "Quel accompagnement proposer concernant le suivi de la transition biologique et l'identité ?",
                answers: [
                    { text: "Éducation vie affective et sexuelle adaptée", points: 25 },
                    { text: "Supports FALC sur puberté et changements", points: 20 },
                    { text: "Intervention infirmière spécialisée", points: 17 },
                    { text: "Orienter vers dispositifs handigynéco", points: 15 },
                    { text: "Travailler l'image et l'estime de soi", points: 13 },
                    { text: "Entretiens sur intimité et consentement", points: 10 }
                ]
            },
            {
                question: "Quel lien établir avec les professionnels assurant le suivi pour l'âge adulte ?",
                answers: [
                    { text: "Réunions de transition tripartites", points: 24 },
                    { text: "Transmettre un dossier de liaison complet", points: 20 },
                    { text: "Périodes de co-accompagnement", points: 17 },
                    { text: "Identifier un référent dans la structure", points: 15 },
                    { text: "Conventions de partenariat", points: 14 },
                    { text: "Suivi post-transition (bilan 3-6 mois)", points: 10 }
                ]
            },
            {
                question: "À quels intervenants faites-vous appel pour organiser la transition avec les personnes et familles ?",
                answers: [
                    { text: "Coordonnateur de parcours complexe", points: 23 },
                    { text: "Référent MDPH", points: 20 },
                    { text: "Équipe mobile d'appui (EMAS)", points: 17 },
                    { text: "Dispositif d'Appui à la Coordination", points: 15 },
                    { text: "Réseau de santé territorial", points: 13 },
                    { text: "Service SAVS/SAMSAH en anticipation", points: 12 }
                ]
            },
            {
                question: "Quel lien entre les professionnels du soin enfant et les nouveaux interlocuteurs adultes ?",
                answers: [
                    { text: "Consultation de transition avec 2 médecins", points: 25 },
                    { text: "Période de suivi conjoint", points: 22 },
                    { text: "Réunion de synthèse médicale", points: 18 },
                    { text: "Transmettre le dossier médical complet", points: 15 },
                    { text: "Continuité des traitements et protocoles", points: 12 },
                    { text: "Utiliser des formulaires de transition", points: 8 }
                ]
            }
        ];

        let currentQuestion = 0;
        let totalScore = 0;
        let roundScore = 0;
        let revealedAnswers = [];
        let completedQuestions = [];

        // Initialize game
        function initGame() {
            createQuestionNav();
            loadQuestion(0);
        }

        // Create question navigation dots
        function createQuestionNav() {
            const nav = document.getElementById('questionNav');
            nav.innerHTML = '';
            questionsData.forEach((_, index) => {
                const dot = document.createElement('button');
                dot.className = 'nav-dot' + (index === 0 ? ' active' : '');
                dot.textContent = index + 1;
                dot.onclick = () => loadQuestion(index);
                nav.appendChild(dot);
            });
        }

        // Load a question
        function loadQuestion(index) {
            currentQuestion = index;
            roundScore = 0;
            revealedAnswers = [];

            const question = questionsData[index];
            document.getElementById('questionNumber').textContent = `Question ${index + 1}/${questionsData.length}`;
            document.getElementById('questionText').textContent = question.question;
            document.getElementById('roundScore').textContent = '0';

            // Update nav dots
            document.querySelectorAll('.nav-dot').forEach((dot, i) => {
                dot.classList.remove('active');
                if (i === index) dot.classList.add('active');
                if (completedQuestions.includes(i)) dot.classList.add('completed');
            });

            // Create answer rows
            const grid = document.getElementById('answersGrid');
            grid.innerHTML = '';

            question.answers.forEach((answer, i) => {
                const row = document.createElement('div');
                row.className = 'answer-row';
                row.onclick = () => revealAnswer(i);
                row.innerHTML = `
                    <div class="answer-number">${i + 1}</div>
                    <div class="answer-box">
                        <div class="answer-hidden"></div>
                        <span class="answer-text">${answer.text}</span>
                    </div>
                    <div class="answer-points">
                        <div class="points-hidden"></div>
                        ${answer.points}
                    </div>
                `;
                grid.appendChild(row);
            });
        }

        // Reveal a single answer
        function revealAnswer(index) {
            if (revealedAnswers.includes(index)) return;

            const rows = document.querySelectorAll('.answer-row');
            const row = rows[index];
            const points = questionsData[currentQuestion].answers[index].points;

            row.classList.add('revealed');
            revealedAnswers.push(index);

            // Update scores
            roundScore += points;
            totalScore += points;
            document.getElementById('roundScore').textContent = roundScore;
            document.getElementById('totalScore').textContent = totalScore;

            // Show ding effect
            showDingEffect();

            // Check if all answers revealed
            if (revealedAnswers.length === questionsData[currentQuestion].answers.length) {
                if (!completedQuestions.includes(currentQuestion)) {
                    completedQuestions.push(currentQuestion);
                    document.querySelectorAll('.nav-dot')[currentQuestion].classList.add('completed');
                }
            }
        }

        // Reveal all answers
        function revealAll() {
            const rows = document.querySelectorAll('.answer-row');
            rows.forEach((row, index) => {
                if (!revealedAnswers.includes(index)) {
                    setTimeout(() => {
                        revealAnswer(index);
                    }, index * 300);
                }
            });
        }

        // Next question
        function nextQuestion() {
            const nextIndex = (currentQuestion + 1) % questionsData.length;
            loadQuestion(nextIndex);
        }

        // Reset game
        function resetGame() {
            totalScore = 0;
            completedQuestions = [];
            document.getElementById('totalScore').textContent = '0';
            document.querySelectorAll('.nav-dot').forEach(dot => dot.classList.remove('completed'));
            loadQuestion(0);
        }

        // Show visual effect for correct answer
        function showDingEffect() {
            const effect = document.getElementById('dingEffect');
            effect.classList.add('show');
            setTimeout(() => effect.classList.remove('show'), 600);
        }

        // Show wrong answer effect (for future use)
        function showWrongEffect() {
            const effect = document.getElementById('wrongMark');
            effect.classList.add('show');
            setTimeout(() => effect.classList.remove('show'), 800);
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
